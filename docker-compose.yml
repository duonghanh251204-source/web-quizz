version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prx_app
    restart: unless-stopped
    # Đã đóng port 80 trực tiếp để bảo mật. Nginx sẽ đứng trước và proxy vào đây.
    volumes:
      - .:/var/www/html
      # Đảm bảo vendor trong container không bị đè bởi vendor trống của máy host (nếu có)
      - /var/www/html/vendor
    env_file:
      - .env
    environment:
      # Tên miền cho nginx-proxy tự động nhận diện
      - VIRTUAL_HOST=prxquizai.id.vn,www.prxquizai.id.vn
      # Tên miền cho acme-companion tự động xin SSL
      - LETSENCRYPT_HOST=prxquizai.id.vn,www.prxquizai.id.vn
      # Các biến này sẽ ghi đè lên file .env để đảm bảo chạy đúng trong Docker
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=prx
      - DB_USERNAME=prx_user
      - DB_PASSWORD=prx_password
      - AI_SERVICE_URL=http://chatbot_ai:8000
    depends_on:
      - db
      - chatbot_ai

  chatbot_ai:
    build:
      context: ./CHATBOT-AI
      dockerfile: Dockerfile
    container_name: prx_chatbot_ai
    restart: unless-stopped
    # Đã đóng port 8000 để bảo mật. Chỉ container app gọi được thông qua mạng nội bộ.
    # Gọi trực tiếp file .env của CHATBOT-AI để nạp cấu hình DeepSeek
    env_file:
      - ./CHATBOT-AI/.env

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: prx_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      # Bạn có thể đổi sang tên miền nếu đã trỏ DNS (ví dụ: VIRTUAL_HOST=pma.prxquizai.id.vn)
    ports:
      - "8080:80"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: prx_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: prx
      MYSQL_USER: prx_user
      MYSQL_PASSWORD: prx_password
      MYSQL_ROOT_PASSWORD: root_password
    # Đã đóng port 3306 để bảo mật. Chỉ ứng dụng nội bộ mới truy cập được.
    volumes:
      - db_data:/var/lib/mysql
      # Tự động import file SQL khi database được khởi tạo lần đầu tiên
      - ./database/prx.sql:/docker-entrypoint-initdb.d/init.sql

  nginx-proxy:
    image: nginxproxy/nginx-proxy:alpine
    container_name: prx_nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - certs:/etc/nginx/certs:ro
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
    depends_on:
      - app

  acme-companion:
    image: nginxproxy/acme-companion
    container_name: prx_acme_companion
    restart: unless-stopped
    volumes_from:
      - nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certs:/etc/nginx/certs:rw
      - acme:/etc/acme.sh
    environment:
      # Thay email này bằng email thật của bạn để nhận thông báo gia hạn SSL
      - DEFAULT_EMAIL=duonghanh251204@gmail.com

volumes:
  db_data:
  certs:
  vhost:
  html:
  acme:
