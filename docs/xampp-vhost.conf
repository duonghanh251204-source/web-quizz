<VirtualHost *:80>
    ServerName prx.local
    DocumentRoot "E:/xampp/htdocs/PRX/public"

    <Directory "E:/xampp/htdocs/PRX/public">
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/prx-error.log"
    CustomLog "logs/prx-access.log" common
</VirtualHost>
