<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>QuizStudio - Làm bài</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Manrope:wght@400;500;600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary-dim": "#00557d",
                    "surface-dim": "#e1cbff",
                    "on-secondary-container": "#004c71",
                    "on-primary": "#f6f0ff",
                    "on-secondary-fixed-variant": "#00567f",
                    "on-secondary": "#eaf4ff",
                    "surface-container-low": "#f7edff",
                    "background": "#fcf4ff",
                    "primary-fixed-dim": "#9780ff",
                    "on-tertiary-fixed-variant": "#645300",
                    "on-error": "#ffefef",
                    "secondary": "#00618f",
                    "primary": "#5e2eef",
                    "on-primary-fixed-variant": "#2d008e",
                    "inverse-primary": "#947dff",
                    "surface-bright": "#fcf4ff",
                    "on-tertiary-fixed": "#433700",
                    "on-tertiary-container": "#594a00",
                    "on-tertiary": "#fff2ce",
                    "inverse-surface": "#14052b",
                    "on-surface-variant": "#64547e",
                    "on-background": "#36274e",
                    "on-secondary-fixed": "#003855",
                    "secondary-fixed": "#a7d7ff",
                    "tertiary-dim": "#5f4e00",
                    "on-surface": "#36274e",
                    "on-primary-fixed": "#000000",
                    "on-primary-container": "#240075",
                    "inverse-on-surface": "#a795c3",
                    "outline-variant": "#b8a5d4",
                    "error-dim": "#a70138",
                    "on-error-container": "#510017",
                    "primary-dim": "#5216e3",
                    "outline": "#806f9a",
                    "tertiary-fixed": "#fdd400",
                    "surface-tint": "#5e2eef",
                    "tertiary-fixed-dim": "#edc600",
                    "surface-container-lowest": "#ffffff",
                    "surface-variant": "#e7d5ff",
                    "surface-container-highest": "#e7d5ff",
                    "tertiary": "#6d5a00",
                    "surface-container-high": "#ecdcff",
                    "primary-fixed": "#a491ff",
                    "error": "#b41340",
                    "secondary-fixed-dim": "#86cbff",
                    "surface": "#fcf4ff",
                    "primary-container": "#a491ff",
                    "error-container": "#f74b6d",
                    "secondary-container": "#a7d7ff",
                    "surface-container": "#f0e3ff",
                    "tertiary-container": "#fdd400"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Plus Jakarta Sans"],
                    "body": ["Manrope"],
                    "label": ["Manrope"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #fcf4ff;
        }
        h1, h2, h3 {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .quiz-choice-card:hover {
            box-shadow: 0 10px 25px rgba(54, 39, 78, 0.08);
            transform: translateY(-2px);
        }
        .custom-shadow {
            box-shadow: 0 20px 40px rgba(54, 39, 78, 0.06), 0 10px 15px rgba(54, 39, 78, 0.04);
        }
    </style>
</head>
<body class="bg-surface text-on-surface antialiased overflow-x-hidden">
<!-- TopNavBar (Fixed) -->
<nav class="fixed top-0 right-0 w-full h-16 bg-[#fcf4ff]/70 dark:bg-slate-950/70 backdrop-blur-xl flex items-center justify-between px-8 z-50 shadow-sm">
<div class="flex items-center gap-6">
<span class="text-xl font-black text-[#36274e] dark:text-white">QuizStudio</span>
<div class="h-6 w-px bg-outline-variant/30"></div>
<span class="font-headline font-bold text-on-surface">Cơ học lượng tử đại cương</span>
</div>
<div class="flex items-center gap-4">
<!-- Timer Component -->
<div class="flex items-center gap-2 bg-surface-container-high px-4 py-2 rounded-full border border-primary/10">
<span class="material-symbols-outlined text-primary" data-icon="timer">timer</span>
<span class="font-headline font-bold text-primary tabular-nums tracking-wider">24:58</span>
</div>
<div class="flex items-center gap-2 ml-4">
<button class="material-symbols-outlined p-2 text-on-surface-variant hover:text-primary transition-colors" data-icon="settings">settings</button>
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center text-xs font-bold text-on-primary-container">AD</div>
</div>
</div>
</nav>
<!-- Main Canvas -->
<main class="pt-24 pb-32 min-h-screen flex flex-col items-center justify-center px-4">
<!-- Progress Bar Floating -->
<div class="w-full max-w-3xl mb-12">
<div class="flex justify-between items-end mb-4">
<div>
<span class="font-label text-xs uppercase tracking-[0.1em] text-on-surface-variant font-bold">Tiến độ làm bài</span>
<h2 class="font-headline text-2xl font-bold text-on-surface mt-1">Câu hỏi 1 <span class="text-on-surface-variant/40 font-medium">/ 10</span></h2>
</div>
<div class="text-right">
<span class="font-label text-xs uppercase tracking-[0.1em] text-on-surface-variant font-bold">Hoàn thành</span>
<p class="font-headline font-extrabold text-secondary">10%</p>
</div>
</div>
<div class="h-2 w-full bg-surface-variant rounded-full overflow-hidden relative">
<div class="h-full w-[10%] bg-gradient-to-r from-secondary to-secondary-fixed-dim rounded-full transition-all duration-500 ease-out flex items-center justify-end">
<div class="w-2 h-2 rounded-full bg-tertiary mr-1 shadow-sm"></div>
</div>
</div>
</div>
<!-- Question Card -->
<section class="w-full max-w-3xl bg-surface-container-lowest rounded-xl custom-shadow relative overflow-hidden">
<!-- Subtle Tonal Header -->
<div class="bg-surface-container-low px-8 py-6">
<div class="flex items-center gap-2 mb-2">
<span class="bg-primary/10 text-primary px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider">Vật lý hiện đại</span>
<span class="bg-tertiary-container/20 text-tertiary px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider">Khó</span>
</div>
<h3 class="font-headline text-xl lg:text-2xl font-bold text-on-surface leading-tight">
                    Trong hiệu ứng quang điện, động năng ban đầu cực đại của các quang electron phụ thuộc vào yếu tố nào sau đây?
                </h3>
</div>
<!-- Options Grid -->
<div class="p-8 space-y-4">
<!-- Option A -->
<button class="quiz-choice-card group w-full text-left flex items-center gap-5 p-5 rounded-lg bg-surface-container-high transition-all duration-300 outline-none hover:bg-primary-container/20 border-2 border-transparent focus:border-primary/30">
<span class="flex-shrink-0 w-12 h-12 rounded-lg bg-surface-container-lowest flex items-center justify-center font-headline font-extrabold text-on-surface group-hover:bg-primary group-hover:text-white transition-colors duration-300">A</span>
<span class="font-body text-on-surface font-semibold text-lg">Cường độ chùm sáng kích thích chiếu vào kim loại.</span>
</button>
<!-- Option B (Selected State Example) -->
<button class="quiz-choice-card group w-full text-left flex items-center gap-5 p-5 rounded-lg bg-primary-container transition-all duration-300 outline-none border-2 border-primary">
<span class="flex-shrink-0 w-12 h-12 rounded-lg bg-primary flex items-center justify-center font-headline font-extrabold text-white">B</span>
<span class="font-body text-on-primary-container font-bold text-lg">Tần số của ánh sáng kích thích và bản chất của kim loại.</span>
<span class="material-symbols-outlined ml-auto text-primary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Option C -->
<button class="quiz-choice-card group w-full text-left flex items-center gap-5 p-5 rounded-lg bg-surface-container-high transition-all duration-300 outline-none hover:bg-primary-container/20 border-2 border-transparent">
<span class="flex-shrink-0 w-12 h-12 rounded-lg bg-surface-container-lowest flex items-center justify-center font-headline font-extrabold text-on-surface group-hover:bg-primary group-hover:text-white transition-colors duration-300">C</span>
<span class="font-body text-on-surface font-semibold text-lg">Thời gian chiếu sáng vào bề mặt kim loại.</span>
</button>
<!-- Option D -->
<button class="quiz-choice-card group w-full text-left flex items-center gap-5 p-5 rounded-lg bg-surface-container-high transition-all duration-300 outline-none hover:bg-primary-container/20 border-2 border-transparent">
<span class="flex-shrink-0 w-12 h-12 rounded-lg bg-surface-container-lowest flex items-center justify-center font-headline font-extrabold text-on-surface group-hover:bg-primary group-hover:text-white transition-colors duration-300">D</span>
<span class="font-body text-on-surface font-semibold text-lg">Diện tích bề mặt kim loại được chiếu sáng.</span>
</button>
</div>
<!-- Glassy Footer Action -->
<div class="px-8 pb-8 pt-2 flex justify-between items-center">
<button class="flex items-center gap-2 text-on-surface-variant font-bold hover:text-primary transition-colors py-2 px-4">
<span class="material-symbols-outlined" data-icon="flag">flag</span>
<span class="font-label text-xs uppercase tracking-widest">Báo lỗi câu hỏi</span>
</button>
<div class="flex gap-2">
<button class="material-symbols-outlined w-10 h-10 rounded-full border border-outline-variant/30 flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-colors" data-icon="bookmark">bookmark</button>
<button class="material-symbols-outlined w-10 h-10 rounded-full border border-outline-variant/30 flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-colors" data-icon="lightbulb">lightbulb</button>
</div>
</div>
</section>
</main>
<!-- Navigation Footer (Fixed) -->
<footer class="fixed bottom-0 left-0 w-full bg-white/80 backdrop-blur-xl px-12 py-6 flex items-center justify-between z-50">
<div class="flex items-center gap-4">
<button class="flex items-center gap-2 px-8 py-3 rounded-full font-headline font-bold text-on-surface border border-outline-variant/30 hover:bg-surface-container-low transition-all active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
                Câu trước
            </button>
</div>
<!-- Question Picker (Bento-style list) -->
<div class="hidden lg:flex items-center gap-2">
<div class="flex gap-1.5 p-1.5 bg-surface-container-low rounded-full">
<div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center text-xs font-bold shadow-md shadow-primary/20">1</div>
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center text-xs font-bold hover:bg-surface-container-high cursor-pointer">2</div>
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center text-xs font-bold hover:bg-surface-container-high cursor-pointer">3</div>
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center text-xs font-bold hover:bg-surface-container-high cursor-pointer">4</div>
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center text-xs font-bold hover:bg-surface-container-high cursor-pointer">5</div>
<div class="px-2 self-center text-on-surface-variant opacity-50">...</div>
<div class="w-8 h-8 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center text-xs font-bold hover:bg-surface-container-high cursor-pointer">10</div>
</div>
<button class="material-symbols-outlined p-2 text-on-surface-variant hover:text-primary transition-colors" data-icon="grid_view">grid_view</button>
</div>
<div class="flex items-center gap-4">
<button class="flex items-center gap-2 px-8 py-4 rounded-full bg-gradient-to-br from-primary to-primary-dim text-white font-headline font-bold shadow-lg shadow-primary/25 hover:scale-[1.02] active:scale-95 transition-all duration-300">
                Tiếp theo
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<div class="h-10 w-px bg-outline-variant/30"></div>
<button class="px-6 py-3 rounded-full font-headline font-bold text-secondary-dim hover:bg-secondary-container transition-colors">
                Nộp bài
            </button>
</div>
</footer>
<!-- Sidebar Decorative Image (Asymmetric Layout) -->
<div class="fixed left-0 top-1/2 -translate-y-1/2 -translate-x-24 opacity-20 pointer-events-none select-none">
<div class="w-64 h-64 rounded-full bg-primary-container blur-3xl"></div>
</div>
<div class="fixed right-0 top-0 translate-x-24 -translate-y-24 opacity-20 pointer-events-none select-none">
<div class="w-96 h-96 rounded-full bg-secondary-container blur-3xl"></div>
</div>
<!-- Right Side Sidebar (Floating Question Map for quick access) -->
<aside class="fixed right-8 top-1/2 -translate-y-1/2 hidden xl:block w-16">
<div class="flex flex-col gap-4 items-center p-3 bg-surface-container-low/50 backdrop-blur-md rounded-full border border-white/40 shadow-sm">
<button class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary hover:bg-white transition-all group" title="Danh sách câu hỏi">
<span class="material-symbols-outlined" data-icon="list_alt">list_alt</span>
</button>
<button class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary hover:bg-white transition-all group" title="Máy tính">
<span class="material-symbols-outlined" data-icon="calculate">calculate</span>
</button>
<button class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary hover:bg-white transition-all group" title="Nháp">
<span class="material-symbols-outlined" data-icon="edit_note">edit_note</span>
</button>
<div class="h-px w-6 bg-outline-variant/30"></div>
<button class="w-10 h-10 rounded-full flex items-center justify-center text-error hover:bg-error-container/20 transition-all group" title="Thoát">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
</aside>
</body></html>
